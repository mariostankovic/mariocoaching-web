<!DOCTYPE html>
<html lang="hr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="pageTitle">Blog — mariocoaching</title>
<meta name="description" id="pageDescription" content="Blog post — mariocoaching">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
  :root{
    --void:#0A0C10;
    --panel:#11151D;
    --panel-2:#161C28;
    --line:#232A38;
    --blue:#3D7FFF;
    --blue-deep:#16233D;
    --blue-glow:rgba(61,127,255,0.18);
    --paper:#F2F4F8;
    --ice:#A9B4C7;
    --ice-dim:#6B7688;

    --display: 'Oswald', sans-serif;
    --body: 'Inter', sans-serif;
    --mono: 'JetBrains Mono', monospace;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{background:var(--void); color:var(--paper); font-family:var(--body); line-height:1.7;}
  a{color:inherit; text-decoration:none;}
  ul{list-style:none;}
  .wrap{max-width:760px; margin:0 auto; padding:0 24px;}

  h1,h2{font-family:var(--display); font-weight:600; color:var(--paper);}

  header{
    position:sticky; top:0; left:0; right:0; z-index:100;
    background:rgba(10,12,16,0.9);
    backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);
  }
  nav{
    max-width:1180px; margin:0 auto; padding:18px 24px;
    display:flex; align-items:center; justify-content:space-between;
  }
  .logo{font-family:var(--display); font-size:1.3rem; font-weight:700;}
  .logo span{color:var(--blue);}
  .back-link{font-size:0.9rem; color:var(--ice); display:flex; align-items:center; gap:8px;}
  .back-link:hover{color:var(--paper);}

  main{padding:56px 0 100px;}

  .eyebrow{
    font-family:var(--mono); font-size:0.78rem; letter-spacing:0.14em; text-transform:uppercase;
    color:var(--blue); margin-bottom:16px;
  }
  .post-title{
    font-size:clamp(1.8rem, 4vw, 2.6rem);
    text-transform:uppercase;
    line-height:1.15;
    margin-bottom:28px;
  }
  .post-cover{
    aspect-ratio:16/9;
    border-radius:4px;
    overflow:hidden;
    background:linear-gradient(160deg, var(--panel-2), var(--void));
    border:1px solid var(--line);
    margin-bottom:36px;
    background-size:cover;
    background-position:center;
  }
  .post-body p{
    color:var(--ice);
    font-size:1.05rem;
    margin-bottom:20px;
  }

  .post-not-found{
    text-align:center;
    padding:80px 0;
    color:var(--ice);
  }
  .post-not-found h1{font-size:1.8rem; margin-bottom:16px; text-transform:uppercase;}

  .btn{
    display:inline-block;
    padding:14px 26px;
    font-size:0.9rem;
    font-weight:600;
    border-radius:2px;
    background:var(--blue);
    color:var(--paper);
    margin-top:20px;
  }
  .btn:hover{background:#2f6ae0;}
</style>
</head>
<body>

<header>
  <nav>
    <a class="logo" href="index.html">MARIOCOACHING</a>
    <a class="back-link" href="index.html#blog">← Natrag na blog</a>
  </nav>
</header>

<main>
  <div class="wrap" id="postContent">
    <!-- Popunjava se automatski JavaScriptom na temelju ?slug= u adresi -->
  </div>
</main>

<script>
  function getSlug(){
    const params = new URLSearchParams(window.location.search);
    return params.get('slug');
  }

  fetch('content/blog.json')
    .then(r => r.json())
    .then(data => {
      const slug = getSlug();
      const post = (data.posts || []).find(p => p.slug === slug);
      const container = document.getElementById('postContent');

      if(!post){
        container.innerHTML = `
          <div class="post-not-found">
            <h1>Post nije pronađen</h1>
            <p>Izgleda da ovaj post ne postoji ili je link netočan.</p>
            <a href="index.html#blog" class="btn">Natrag na blog</a>
          </div>
        `;
        return;
      }

      document.getElementById('pageTitle').textContent = post.title + ' — mariocoaching';
      if(post.excerpt){
        document.getElementById('pageDescription').setAttribute('content', post.excerpt);
      }

      const bodyHtml = (post.body || '')
        .split(/\n\s*\n/)
        .map(paragraph => `<p>${paragraph.trim()}</p>`)
        .join('');

      container.innerHTML = `
        <div class="eyebrow">${post.category || 'Blog'}</div>
        <h1 class="post-title">${post.title}</h1>
        ${post.cover_image ? `<div class="post-cover" style="background-image:url('${post.cover_image}')"></div>` : ''}
        <div class="post-body">${bodyHtml}</div>
        <a href="index.html#blog" class="btn">← Natrag na blog</a>
      `;
    })
    .catch(() => {
      document.getElementById('postContent').innerHTML = `
        <div class="post-not-found">
          <h1>Greška pri učitavanju</h1>
          <p>Nešto je pošlo po krivu. Pokušaj kasnije.</p>
          <a href="index.html#blog" class="btn">Natrag na blog</a>
        </div>
      `;
    });
</script>

</body>
</html>
