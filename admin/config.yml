backend:
  name: git-gateway
  branch: main

media_folder: "images/uploads"
public_folder: "images/uploads"

collections:
  - name: "transformations"
    label: "Transformacije"
    files:
      - name: "transformations"
        label: "Lista transformacija"
        file: "content/transformations.json"
        fields:
          - name: "items"
            label: "Transformacije"
            widget: "list"
            label_singular: "Transformacija"
            fields:
              - {name: "label", label: "Naziv (interno, npr. ime klijenta)", widget: "string", required: false}
              - {name: "image", label: "Fotografija (prije/poslije, napravljena u Canvi)", widget: "image", required: false}

  - name: "testimonials"
    label: "Recenzije"
    files:
      - name: "testimonials"
        label: "Lista recenzija"
        file: "content/testimonials.json"
        fields:
          - name: "items"
            label: "Recenzije"
            widget: "list"
            label_singular: "Recenzija"
            fields:
              - {name: "quote", label: "Tekst recenzije", widget: "text"}
              - {name: "name", label: "Ime osobe (ili 'Primjer recenzije')", widget: "string"}

  - name: "settings"
    label: "Postavke stranice"
    files:
      - name: "settings"
        label: "Hero, O meni, Usluge, Kontakt"
        file: "content/settings.json"
        fields:
          - {name: "hero_title", label: "Hero naslov (pitanje)", widget: "string"}
          - {name: "hero_subline", label: "Hero manja recenica ispod naslova", widget: "string"}
          - {name: "hero_lead", label: "Hero recenica ispod toga", widget: "text"}
          - {name: "hero_image", label: "Naslovna fotografija (hero)", widget: "image"}
          - {name: "about_title", label: "O meni naslov", widget: "string"}
          - {name: "about_text", label: "O meni tekst (prazan red = novi paragraf)", widget: "text"}
          - name: "about_carousel"
            label: "O meni karusel fotografija"
            widget: "list"
            label_singular: "Fotografija"
            fields:
              - {name: "image", label: "Fotografija", widget: "image", required: false}
              - {name: "label", label: "Opis (interno)", widget: "string", required: false}
          - {name: "online_desc", label: "Online Coaching opis", widget: "text"}
          - name: "online_features"
            label: "Online Coaching bulletpointsi"
            widget: "list"
            label_singular: "Stavka"
            fields:
              - {name: "text", label: "Tekst", widget: "string"}
          - {name: "uzivo_desc", label: "Trening Uzivo opis", widget: "text"}
          - name: "uzivo_features"
            label: "Trening Uzivo bulletpointsi"
            widget: "list"
            label_singular: "Stavka"
            fields:
              - {name: "text", label: "Tekst", widget: "string"}
          - {name: "contact_email", label: "Email", widget: "string"}
          - {name: "instagram_url", label: "Instagram link", widget: "string"}
          - {name: "tiktok_url", label: "TikTok link", widget: "string"}

  - name: "blog"
    label: "Blog"
    files:
      - name: "blog"
        label: "Blog postovi"
        file: "content/blog.json"
        fields:
          - name: "posts"
            label: "Postovi"
            widget: "list"
            label_singular: "Post"
            summary: "{{title}}"
            fields:
              - {name: "title", label: "Naslov", widget: "string"}
              - {name: "slug", label: "URL oznaka (samo malim slovima, bez razmaka, npr. moj-prvi-post)", widget: "string"}
              - {name: "category", label: "Kategorija (npr. Trening, Prehrana, Higijena)", widget: "string"}
              - {name: "cover_image", label: "Naslovna fotografija", widget: "image", required: false}
              - {name: "excerpt", label: "Kratki opis (prikazuje se u pregledu)", widget: "text"}
              - {name: "body", label: "Cijeli tekst posta (prazan red = novi paragraf)", widget: "text"}
